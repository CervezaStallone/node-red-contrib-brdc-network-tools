<script type="text/javascript">
    RED.nodes.registerType('traceroute', {
        category: 'brdc-network-nodes',
        color: '#F44336',
        defaults: {
            name: {value: ""},
            target: {value: ""},
            maxHops: {value: 30, validate: RED.validators.number()},
            timeout: {value: 30000, validate: RED.validators.number()}
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["success", "failure"],
        icon: "inject.png",
        label: function() {
            return this.name || this.target || "traceroute";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        paletteLabel: "traceroute",
        oneditprepare: function() {
            if (!this.maxHops) {
                $("#node-input-maxHops").val(30);
            }
            if (!this.timeout) {
                $("#node-input-timeout").val(30000);
            }
        }
    });
</script>

<script type="text/html" data-template-name="traceroute">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-target"><i class="fa fa-globe"></i> Target</label>
        <input type="text" id="node-input-target" placeholder="192.168.1.1 or leave empty to use msg.payload">
        <div class="form-tips">
            <strong>Tip:</strong> Leave empty to use <code>msg.payload</code> as the target
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-maxHops"><i class="fa fa-sort-numeric-asc"></i> Max Hops</label>
        <input type="number" id="node-input-maxHops" placeholder="30" min="1" max="255">
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="number" id="node-input-timeout" placeholder="30000" min="1000">
        <div class="form-tips">
            Maximum time the overall traceroute command is allowed to run, in milliseconds
        </div>
    </div>
</script>

<script type="text/html" data-help-name="traceroute">
    <p>A node that traces the network route to a target host and returns the list of hops.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>Target IP address or hostname to trace (if not configured in the node)</dd>
        <dt class="optional">maxHops <span class="property-type">number</span></dt>
        <dd>Overrides the configured maximum number of hops</dd>
    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Success output
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>
                    <ul>
                        <li><code>target</code> - the traced target</li>
                        <li><code>hops</code> - array of hop objects: <code>hop</code> (number), <code>ip</code> (string or null), <code>times</code> (array of ms values), <code>timeout</code> (true if the hop timed out)</li>
                        <li><code>raw</code> - raw command output</li>
                        <li><code>timestamp</code> - ISO timestamp of when the trace completed</li>
                    </ul>
                </dd>
            </dl>
        </li>
        <li>Failure output
            <dl class="message-properties">
                <dt>payload <span class="property-type">object</span></dt>
                <dd>
                    <ul>
                        <li><code>error</code> - the error message</li>
                        <li><code>target</code> - the target that was attempted</li>
                    </ul>
                </dd>
            </dl>
        </li>
    </ol>

    <h3>Details</h3>
    <p>This node runs the platform's <code>traceroute</code> (or <code>tracert</code> on Windows) command against a target and parses the hop-by-hop output.</p>
    <p>The target can be:</p>
    <ul>
        <li>Configured in the node properties</li>
        <li>Passed in <code>msg.payload</code></li>
    </ul>
    <p>The node has two outputs:</p>
    <ul>
        <li><strong>Success (top):</strong> When the command runs and produces hop output (even a partial route)</li>
        <li><strong>Failure (bottom):</strong> When the command errors and produces no output at all (e.g. the target cannot be resolved)</li>
    </ul>
    <p>The node status shows the current state: tracing, number of hops found, or error.</p>

    <h3>Examples</h3>
    <p><strong>Trace to Google DNS:</strong></p>
    <pre>msg.payload = "8.8.8.8";</pre>

    <h3>Configuration</h3>
    <p><strong>Name:</strong> Optional name for the node (shown in the flow)</p>
    <p><strong>Target:</strong> Default IP address or hostname to trace. Leave empty to use <code>msg.payload</code></p>
    <p><strong>Max Hops:</strong> Maximum number of hops to probe. Default is 30</p>
    <p><strong>Timeout:</strong> Maximum time in milliseconds the overall command may run. Default is 30000ms</p>
</script>
